rules:
  - sid: 2012726
    rev: 7
    name: "ET SCAN OpenVASVT RCE Test String in HTTP Request Inbound"
    attack_type: "OpenVAS RCE test string scan"
    category: "attempted-recon"
    severity: 3
    cve: []
    cve_applicable: false
    mitre: ["T1595"]
    mitre_applicable: true
    attacker_role: client
    success_indicators:
      http_status_success: [200, 201, 202]
      http_status_failure: [400, 401, 403, 404, 500]
      payload_contains_success: ["CONTROLLED_SUCCESS_MARKER"]
      payload_contains_failure: ["CONTROLLED_FAILURE_MARKER"]
    recommended_actions:
      - phase: validate
        action: "Inspect the URL and payload for the OpenVAS RCE marker."
        evidence: ["http.url", "payload_printable"]
      - phase: scope
        action: "Confirm whether the client IP belongs to an approved scanner and find adjacent scan traffic."
        evidence: ["client_ip", "flow_id"]
      - phase: contain
        action: "Rate-limit or block the client when scanning is unauthorized."
        evidence: ["client_ip"]
        condition: "scanner_not_approved"

